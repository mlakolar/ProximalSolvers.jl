name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
# Use the repository write defaults. An explicit permissions block omits
# permissions needed when releasing commits that change workflow files.
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    # The SSH key (DOCUMENTER_KEY) comes from the deploy-key environment, which admits only master
    # and v* tags, so pull-request runs cannot obtain it.
    environment: deploy-key
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # deploy key: pushing tags for commits that change workflow files needs SSH
          ssh: ${{ secrets.DOCUMENTER_KEY }}
