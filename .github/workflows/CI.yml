name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  benchmark-evidence:
    name: Benchmark evidence integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python benchmark/adaptive/broad/check_summary.py
      - run: python benchmark/adaptive/broad/check_evidence.py
      - run: python benchmark/slope/check_summary.py
      - run: python benchmark/slope/check_evidence.py
      - run: python benchmark/slope/path_reuse/check_summary.py
      - run: python benchmark/slope/path_reuse/check_evidence.py
      - run: python benchmark/slope/first_order/check_summary.py
      - run: python benchmark/slope/first_order/check_evidence.py
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          - version: '1'
            os: macos-latest
            arch: aarch64
          - version: '1'
            os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # Composite duality gaps need the ProximalBase companion of issue #23.
      # Julia 1.11 and later take its pinned revision from [sources] in
      # Project.toml; Julia 1.10 ignores [sources]. Remove this step and [sources]
      # after the companion is merged and released.
      - name: Add ProximalBase from GitHub on Julia 1.10
        if: matrix.version == 'lts'
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.add(url="https://github.com/mlakolar/ProximalBase.jl", rev="1f93b03c9c4652636ab0f173e6027268d877aa3a")
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
