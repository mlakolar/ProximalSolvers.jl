name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  benchmark-analysis:
    name: Benchmark analysis controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python benchmark/check_analysis.py
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        # ParallelTestRunner worker processes per job (PTR_NUM_JOBS; the default from free
        # memory gives too few on macOS). Measured choices: test/TESTING.md.
        ptr_jobs:
          - '4'
        include:
          - version: '1'
            os: macos-latest
            arch: aarch64
            ptr_jobs: '3'
          - version: '1'
            os: windows-latest
            arch: x64
            ptr_jobs: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Check naming conventions
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check_naming.py
      - name: Resolve registered dependencies
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Test against registered dependencies
        id: tests
        shell: bash
        run: |
          start=$(date +%s)
          status=0
          julia --color=yes scripts/test.jl --verbose 2>&1 | tee "$RUNNER_TEMP/test-output.log" || status=$?
          echo $(( $(date +%s) - start )) > "$RUNNER_TEMP/test-seconds"
          exit $status
        env:
          JULIA_TEST_COVERAGE: 'true'
          PTR_NUM_JOBS: ${{ matrix.ptr_jobs }}
      - name: Timing summary
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        continue-on-error: true
        shell: bash
        run: julia --startup-file=no scripts/test_report.jl "$RUNNER_TEMP/test-output.log" "$(cat "$RUNNER_TEMP/test-seconds")" >> "$GITHUB_STEP_SUMMARY"
        env:
          TEST_REPORT_TITLE: Julia ${{ matrix.version }}, ${{ matrix.os }}, ${{ matrix.ptr_jobs }} workers
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          # Codecov repository lookup requires its canonical lowercase slug.
          slug: mlakolar/proximalsolvers.jl
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
