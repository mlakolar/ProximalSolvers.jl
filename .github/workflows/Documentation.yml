name: Documentation
# Every PR/push builds and checks docs in a read-only job, never with deploy credentials.
# Same-repository non-draft PRs publish only validated HTML artifacts to gh-pages
# previews/PR<N>/ in a separate writer job that never executes PR code.
# Fork PRs and draft PRs retain the rendered artifact but are not published.
# Master and v* deployments remain gated by the protected deploy-key environment.
on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  contents: read
jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: false # deletion needs actions: write
      - name: Check documentation structure and migration records
        shell: bash
        env:
          DOCS_EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOCS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # PRs compare with their base; pushes compare with the pre-push commit.
          # Manual builds compare with the published default branch, including
          # when the selected branch has several migration commits already.
          if [[ -n "$DOCS_EVENT_BASE" && ! "$DOCS_EVENT_BASE" =~ ^0+$ ]]; then
            [[ "$DOCS_EVENT_BASE" =~ ^[0-9a-f]{40}$ ]]
            docs_base="$DOCS_EVENT_BASE"
            git fetch --no-tags --depth=1 origin "$docs_base"
          else
            git fetch --no-tags --depth=1 origin "refs/heads/$DOCS_DEFAULT_BRANCH"
            docs_base="$(git rev-parse FETCH_HEAD)"
          fi
          docs_introduced=false
          if ! git cat-file -e "$docs_base:docs/migration/baseline.json" 2>/dev/null; then
            docs_introduced=true
            mapfile -t docs_snapshots < <(python3 -c 'import json; m=json.load(open("docs/migration/baseline.json")); print(m["baseline"]); print(m["implementation_baseline"])')
            [[ "${#docs_snapshots[@]}" -eq 2 ]]
            for docs_snapshot in "${docs_snapshots[@]}"; do
              [[ "$docs_snapshot" =~ ^[0-9a-f]{40}$ ]]
              git fetch --no-tags --depth=1 origin "$docs_snapshot"
            done
          fi
          python3 -m unittest discover -s scripts -p 'test_docs*.py'
          python3 scripts/docs_ledger.py verify-baseline --previous-ref "$docs_base"
          python3 scripts/check_docs_layers.py --previous-ref "$docs_base"
          python3 scripts/docs_ledger.py check --structural
          # Freeze integrated examples and non-docstring code only while introducing
          # the migration. The immutable inventory remains checked on future PRs.
          if [[ "$docs_introduced" == true ]]; then
            python3 scripts/check_docs_layers.py --migration
            python3 scripts/docs_ledger.py check
          fi
      - name: Install the documentation environment
        run: julia --color=yes --project=docs -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate(); Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)'
      - name: Build and check
        shell: bash
        run: |
          set -euo pipefail
          julia --project=docs docs/make.jl 2>&1 | tee "$RUNNER_TEMP/ps-docs-build.log"
          python3 scripts/docs_ledger.py check-urls
      - name: Preserve rendered HTML
        uses: actions/upload-artifact@v7
        with:
          name: documentation-linux-current-julia
          path: docs/build
          if-no-files-found: error
          retention-days: 14
      - name: Preserve documentation build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-build-log-linux-current-julia
          path: ${{ runner.temp }}/ps-docs-build.log
          if-no-files-found: ignore
          retention-days: 14
  preview:
    name: Publish PR documentation preview
    needs: docs
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gh-pages-writes
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # The only job allowed to publish checks out gh-pages, never the PR's code.
      - name: Checkout published Pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          persist-credentials: true
      - name: Retrieve validated HTML artifact
        uses: actions/download-artifact@v8
        with:
          name: documentation-linux-current-julia
          path: ${{ runner.temp }}/docs-preview
      - name: Publish isolated PR preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HTML_DIR: ${{ runner.temp }}/docs-preview
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          test -f "$HTML_DIR/index.html"
          preview_dir="previews/PR${PR_NUMBER}"
          mkdir -p "$preview_dir"
          rsync -a --delete "$HTML_DIR/" "$preview_dir/"
          git add -A -- "$preview_dir"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "docs: publish preview for PR ${PR_NUMBER}"
            git push origin HEAD:gh-pages
          fi
      - name: Show PR preview link
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo "## Documentation preview"
            echo ""
            echo "Validated documentation for PR #${PR_NUMBER}:"
            echo ""
            echo "https://mlakolar.github.io/ProximalSolvers.jl/previews/PR${PR_NUMBER}/"
          } >> "$GITHUB_STEP_SUMMARY"
  deploy:
    name: Deploy documentation
    needs: docs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-writes
      cancel-in-progress: false
    timeout-minutes: 60
    environment: deploy-key
    permissions:
      contents: write # Documenter pushes gh-pages (with the deploy key; the token is its fallback)
      statuses: write # Documenter reports the deployment as a commit status
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: false
      - name: Install the documentation environment
        run: julia --color=yes --project=docs -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate(); Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)'
      - name: Build and deploy
        run: julia --project=docs docs/make.jl
        env:
          DOCUMENTER_DEPLOY: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
