# Which test tier CI runs for a pull request (adapted from ProximalBase.jl). Read by test/tiers.jl
# for scripts/ci_plan.jl and checked by test/tier_selection.jl; the test files of each tier are
# in test/tiers.toml. CONTRIBUTING.md explains the workflow and test/TESTING.md the choices.

[timeouts]
# Minutes per CI test job, well above each tier's measured time to allow for cold caches.
quick = 20
standard = 30
full = 60

# The minimum tier of a PR. Each changed path takes the first rule below that matches it
# (`*` within a directory, `**` across directories); the PR gets the highest of these tiers
# and of its test:standard or test:full labels. A path no rule matches gets full. "none": no
# package tests (the plan, the naming check and the benchmark analysis controls still run).
# Changed test files, and the `focus` files of the matched rules, run beside the tier. Every
# source file is named explicitly, so a new one plans full, and test/tier_selection.jl fails
# until a rule names it.
#
[[risk]]
why = "documentation; the Documentation workflow builds it"
tier = "none"
paths = ["docs/**", "**/*.md", "LICENSE", ".gitignore", "codecov.yml"]

[[risk]]
why = "the exploratory minimal-core benchmark has its own test"
tier = "quick"
focus = ["benchmark_explore"]
paths = ["benchmark/minimal/**"]

[[risk]]
why = "the formal benchmark harness's current-core cases, runner and setup have their own test"
tier = "quick"
focus = ["benchmark_formal"]
paths = [
  "benchmark/problems.jl", "benchmark/certificates.jl", "benchmark/cases.jl", "benchmark/run.jl",
  "benchmark/setup.jl", "benchmark/local.jl", "benchmark/validate.py",
]

[[risk]]
why = "not part of the package tests: their own jobs, the plan's naming check, or run by hand"
tier = "none"
paths = [
  "benchmark/**",
  "scripts/check_naming.py",
  "scripts/instantiate.jl",
  "scripts/master_dependencies.jl",
  "scripts/test_master.jl",
  ".github/dependabot.yml",
  ".github/workflows/CompatHelper.yml",
  ".github/workflows/Documentation.yml",
  ".github/workflows/Nightly.yml",
  ".github/workflows/TagBot.yml",
]

[[risk]]
why = "test runner, CI and dependencies: every tier and the required Linux job must still work"
tier = "full"
paths = [
  ".github/tier-rules.toml",
  ".github/workflows/CI.yml",
  "Project.toml",
  "scripts/ci_environment.jl",
  "scripts/paired_master_diagnostics.jl",
  "scripts/paired_master_probe.jl",
  "scripts/ci_gate.jl",
  "scripts/ci_plan.jl",
  "scripts/ci_verdict.jl",
  "scripts/test.jl",
  "scripts/test_report.jl",
  "test/runtests.jl",
  "test/tiers.jl",
]

[[risk]]
why = "the tier lists decide what every tier runs: an edit other than adding new test files can move a test out of the PR tiers"
tier = "full"
paths = ["test/tiers.toml"]

[[risk]]
why = "shared minimal-core numerical implementation: full required Linux validation"
tier = "full"
paths = [
  "src/ProximalSolvers.jl", "src/types.jl", "src/solve.jl", "src/blocks.jl",
  "src/line_searches.jl", "src/precompile.jl", "src/utils.jl",
  "src/cd/models.jl", "src/cd/solver.jl", "src/cd/leastsquares.jl",
  "src/solvers/image_models.jl", "src/solvers/proximal_gradient_descent.jl",
  "src/solvers/accelerated_proximal_gradient_descent.jl",
]
[[risk]]
why = "changed test files run beside the tier"
tier = "quick"
paths = ["test/**/*.jl"]
[[risk]]
why = "both supported examples are tests"
tier = "quick"
focus = ["examples"]
paths = ["examples/**"]

# Registrations of explicit native calls in the package source. No [[native]] table is defined
# here, because no file under src/ matches the guard today. test/tier_selection.jl reads the table
# (test/tiers.jl loads this file for scripts/ci_plan.jl but does not read it). The test scans every
# line of the .jl files under src/ (and ext/, if it exists) against NATIVE_PATTERNS, comments and
# strings included, so a match in a comment or a string also counts: reword the text or register
# the file. The patterns name `ccall`, `@ccall`, `cglobal` and `llvmcall`; `LinearAlgebra.LAPACK`,
# `LinearAlgebra.BLAS` and `Base.Libc` (spaces around the dot allowed), whatever follows the name; an
# unqualified word `LAPACK`, `BLAS` or `Libc`, unless whitespace and then a letter or underscore
# follow it (prose such as "BLAS kernel"); a `:LAPACK`-style symbol; `Libdl`; and a `using` or
# `import` statement (`import ... as` included) that names LAPACK, BLAS, Libdl or Libc, also when it
# continues on lines after a trailing `,` or `:`. A file with a match fails the test unless an entry
# below lists it. Known miss: an unqualified module name followed by whitespace and an identifier,
# such as the macro argument in `@m BLAS x`. Out of scope: names built at run time
# (`eval(Symbol(...))`, `getfield` with a computed symbol) and the expansion of external macros;
# this describes what the test reads, not a claim that no native call can escape it. Generic linear algebra such as `mul!` or
# `dot` is not matched.
#
# An entry has exactly these keys:
#   why         a non-empty string: what the native call is for
#   paths       a non-empty list of source files, each existing and with a match
#   checks      a non-empty list of test names from the tier lists: the tests that must run on the platforms
#   platforms   a non-empty list drawn from "macos-latest" and "windows-latest"
#   enforcement a string: a pre-merge mechanism named in IMPLEMENTED_NATIVE_ENFORCEMENT in
#               test/tier_selection.jl
# That list is empty, so every entry fails the test until a pull request implements such a
# mechanism (a pre-merge platform job in the plan and verdict of CI.yml, which has no macOS or
# Windows job today) and names it in that list; the entry alone does not pass it.
#
# test/tiers.jl `load` merges the top-level keys of this file into the tier data and rejects only
# a key that both files define, and `parse_manifest` does not read a `native` key, so the loader
# accepts the table.
#
# [[native]]
# why = "..."
# paths = ["src/example.jl"]
# checks = ["example_test"]
# platforms = ["macos-latest"]
# enforcement = "pre-merge-platform-job"
