# Which test tier CI runs for a pull request (adapted from ProximalBase.jl). Read by test/tiers.jl
# for scripts/ci_plan.jl and checked by test/tier_selection.jl; the test files of each tier are
# in test/tiers.toml. CONTRIBUTING.md explains the workflow and test/TESTING.md the choices.

[timeouts]
# Minutes per CI test job, well above each tier's measured time to allow for cold caches.
quick = 20
standard = 30
full = 60

# The minimum tier of a PR. Each changed path takes the first rule below that matches it
# (`*` within a directory, `**` across directories); the PR gets the highest of these tiers
# and of its test:standard or test:full labels. A path no rule matches gets full. "none": no
# package tests (the plan, the naming check and the benchmark analysis controls still run).
# Changed test files, and the `focus` files of the matched rules, run beside the tier. Every
# source file is named explicitly, so a new one plans full, and test/tier_selection.jl fails
# until a rule names it.
#
[[risk]]
why = "documentation; the Documentation workflow builds it"
tier = "none"
paths = ["docs/**", "**/*.md", "LICENSE", ".gitignore", "codecov.yml"]

[[risk]]
why = "not part of the package tests: their own jobs, the plan's naming check, or run by hand"
tier = "none"
paths = [
  "benchmark/**",
  "scripts/check_naming.py",
  "scripts/instantiate.jl",
  "scripts/master_dependencies.jl",
  "scripts/test_master.jl",
  ".github/dependabot.yml",
  ".github/workflows/CompatHelper.yml",
  ".github/workflows/Documentation.yml",
  ".github/workflows/TagBot.yml",
]

[[risk]]
why = "test runner, CI and dependencies: every tier and the required Linux job must still work"
tier = "full"
paths = [
  ".github/tier-rules.toml",
  ".github/workflows/CI.yml",
  "Project.toml",
  "scripts/ci_environment.jl",
  "scripts/ci_gate.jl",
  "scripts/ci_plan.jl",
  "scripts/ci_verdict.jl",
  "scripts/test.jl",
  "scripts/test_report.jl",
  "test/runtests.jl",
  "test/tiers.jl",
]

[[risk]]
why = "the tier lists decide what every tier runs: an edit other than adding new test files can move a test out of the PR tiers"
tier = "full"
paths = ["test/tiers.toml"]

[[risk]]
why = "shared minimal-core numerical implementation: full required Linux validation"
tier = "full"
paths = [
  "src/ProximalSolvers.jl", "src/types.jl", "src/solve.jl", "src/blocks.jl",
  "src/line_searches.jl", "src/precompile.jl", "src/utils.jl",
  "src/cd/models.jl", "src/cd/solver.jl", "src/cd/leastsquares.jl",
  "src/solvers/image_models.jl", "src/solvers/proximal_gradient_descent.jl",
]
[[risk]]
why = "changed test files run beside the tier"
tier = "quick"
paths = ["test/**/*.jl"]
[[risk]]
why = "both supported examples are tests"
tier = "quick"
focus = ["examples"]
paths = ["examples/**"]
