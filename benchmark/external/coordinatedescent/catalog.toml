# Frozen case settings. Each family runs from the loosest to the tightest rung.
# CoordinateDescent v0.6.1 src/utils.jl:77-91,167-174; HighDimensionalModels
# ae44440 src/utils.jl:78-88,135-144,283-285. "default" preserves nothing.
# The contract uses 0.1 and 0.02 times least-squares lambda_max for single solves.
# Current Gram selection stays at its public default; run.jl --gram-off is a labeled control.
# ProximalSolvers src/cd/gap.jl:167-169 and path.jl:190-198: quadratic models
# have no gap stopping. This includes the public auto-Gram path on design C.
schema_version = 1
case_seconds = 120.0
tolerance_grid = [0.0001, 3e-05, 1e-05, 3e-06, 1e-06, 3e-07, 1e-07, 3e-08, 1e-08]
gap_tolerance_grid = [0.0001, 3e-05, 1e-05, 3e-06, 1e-06]

