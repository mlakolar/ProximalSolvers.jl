# Stage 2B workload-compatibility mapping of the 19 Stage 2A cases (#110).
#
# One [[case]] per case of benchmark/campaigns/pre06/cases.txt, in that order. Every field is
# required and non-empty. `class` is provisional (A, B, C or D):
#   A  equivalent, unchanged harness
#   B  equivalent with a reviewed compatibility-only harness port
#   C  semantically changed; needs a separate mapping
#   D  not comparable or failed
# Class A means the harness (reset, inputs, certificate, timed operation) needs no edit; the
# remaining gap, if any, is solver migration and the pilot, stated in `verification_needed`.
# No class C or D is assigned: there is no evidence for one yet. A `data_hash` match is never
# the evidence for a class.
#
# Citations are `file:line` at ProximalSolvers 7b9b5295 (src/ is byte-identical to the measured
# source b0de3f7) unless marked as a probe (benchmark/campaigns/stage2b/probes/results/).
# Anything not verified is marked `unverified`. `sensitive_paths_06` lists the ProximalBase 0.6
# changes (x.p of the symmetric owner, _symmetric_penalty, fill! as a clear, x.groups,
# x.storage, LogDetLoss symmetry, coordinates(x) === x, _svd_cache!) that the case's solver call
# path touches, or states that git grep found none.
#
# Approval record (maintainer decision on #110, comment 6694764350): the classification below is approved as the
# pre-candidate audit for implementation and testing of PR B (18 class A, P14 class B, no C or D); it is not a
# finding that any case works on a 0.6 candidate, and candidate-specific revalidation and sign-off are required
# before any official measurement. Every row has `approved`; a class B row also has `approval_url`,
# `approval_scope`, `port_text` and `new_harness_hash` (the true hash is recorded at the port commit, never
# written here). The comparison tool (MIGRATION_COMPARE_SPEC.md) requires `approved = true` and a non-empty
# `approval_url` for class B only; any other class is refused unless a separate approved mapping is present.
#
# Provisional until a ProximalBase 0.6 candidate commit and a migrated ProximalSolvers commit
# exist (STAGE2B_PLAN.md, gates G1-G8). Read by Python's tomllib (test_stage2b_files.py).

