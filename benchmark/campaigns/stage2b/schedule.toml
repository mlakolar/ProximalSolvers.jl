# Stage 2B campaign schedule (#110): the single machine-readable definition that
# migration_compare.py and its tests read (MIGRATION_COMPARE_SPEC.md, section 16).
#
# PRE-FREEZE DRAFT. The F1-B freeze of Stage 2B (STAGE2B_PLAN.md, section 15) fixes this file together with the
# specification, the mapping, the repetition count, the order scheme, the screens and the reporting rules. No
# official timing may use it before that freeze; any later change is a new campaign identity.
#
# Design: eight A/A and eight A/B paired fresh-process blocks per Julia-version stratum, repetition IDs 1-8; block
# i uses repetition ID i; blocks are executed in the order given by `orders`, the same for both arms. Four AB
# and four BA; each order has two odd and two even repetition IDs. Eight is within the PS_REPETITION cap of 10
# (benchmark/run.jl:63-64). The A/A arm uses two independent installations of the identical Stack A.
#
# [settings] and [machine] repeat the frozen Stage 2A values (benchmark/campaigns/pre06/campaign.toml and the
# metadata records of its archive); test_stage2b_files.py checks them against that file. Read by Python's tomllib.

schema = 1

[schedule]
id = "stage2b-8block-v1"
campaign_id = "pb06-migration-stage2b-v1"
reps = [1, 2, 3, 4, 5, 6, 7, 8]
arms = ["AB", "AA"]
orders = { 1 = "AB", 2 = "BA", 3 = "BA", 4 = "AB", 5 = "BA", 6 = "AB", 7 = "AB", 8 = "BA" }

# The sampling settings of every formal process, as the run.jl metadata records them (`groups` is the sorted,
# comma-joined list that run.jl writes; PS_GROUPS of campaign.toml lists the same groups in another order).
# case_filter is cases.txt of the Stage 2A campaign joined by commas, byte for byte as PS_CASES.
[settings]
suite = "extended"
groups = "admm,cd,gradient,newton,paths,primal_dual,sgl"
case_filter = "cd/lasso-dense/cd/B/call,cd/lasso-csc/cd/B/call,cd/lasso-dense/cd/B/workspace,cd/group-lasso/cd/tight/call,sgl/sparse-group/cd/tight/call,cd/weighted-lasso/cd/tight/workspace,gradient/lasso/apg/tight/call,gradient/lasso/apg/tight/workspace,newton/logistic-weighted-offset/prox-newton/tight/call,newton/glasso/quic/tight/call,admm/lasso/admm/B/call,admm/lasso/admm/B/workspace,admm/lasso/admm/construction/setup,paths/lasso/cd/grid8/call,gradient/lasso/active/B/call,newton/glasso-larger/quic/tight/call,cd/lasso-D/cd/tight/call,primal_dual/generalized-lasso/condat-vu/tight/call,gradient/lasso-D/apg/tight/call"
samples_target = 100
seconds_limit = 3.0
case_seconds = 60.0
profile_seconds = 0.0
julia_threads = 1
blas_threads = 1
seed_scheme = "FNV1a64 keyed scenario xor repetition"

# The machine policy of Stage 2A (campaign.toml [machine]). `cpu` is Sys.CPU_NAME, which depends on the Julia
# build (metadata `cpu`), so it is given per stratum. smt_control is the value the Stage 2A hardware records
# carried; it is not a policy value of campaign.toml. governor, epp, no_turbo and smt_control are labelled, not
# refused, when a campaign carries other values (MIGRATION_COMPARE_SPEC.md, section 5).
[machine]
cpu_model = "13th Gen Intel(R) Core(TM) i9-13900"
cpu = { "1.10" = "goldmont", "1.13" = "raptorlake" }
logical_cpu = 6
smt_sibling = 7
governor = "powersave"
epp = "balance_performance"
no_turbo = "0"
smt_control = "on"

# The exact Julia builds of Stage 2A (campaign.toml [[julia]] tables).
[julia."1.10"]
version = "1.10.13"
commit = "e184dd512e35c5a6e036c9aab5e4de5a3345f62d"

[julia."1.13"]
version = "1.13.3"
commit = "67ac47b9cd855e02134d41d5428ac9f2a73f2694"

# The historical Stack A identity: ProximalSolvers b0de3f7 and ProximalBase 0.5.4 (the tag v0.5.4 is accepted
# only as its tag commit with the release tree), and the harness hash of that campaign.
[stack_a]
harness_hash = "b7bf3d953ec6e9f9720e74d7895b5cf95a629fd4"

[stack_a.proximalsolvers]
commit = "b0de3f7fc91767b97197ff4b458207e308998943"
tree = "a836d532008782e75f2b2a7e4666fa1df24b34dc"
version = "0.3.2"

[stack_a.proximalbase]
tag = "v0.5.4"
commit = "9c5a43bf0b7e3f51f0a401b785c332200ffa5d7e"
tree = "1226119eb2cc6144f7345c727f0e7682632f7826"
version = "0.5.4"
release = "registered"
