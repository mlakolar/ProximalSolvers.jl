]
objective = [
  "s * LeastSquaresLoss(y, X) with s = 1/n (benchmark_model, benchmark/cases.jl:95)",
]
penalty = [
  "NormL1(lambda): all weights are one, so the unweighted constructor is used (benchmark/cases.jl:109-110)",
]
initial_state = [
  "zeros(160) (core_problem, :316), held as a plain Vector of Float32",
]
working_set = [
  "none held by the caller: a dense Vector iterate",
]
reset = [
  "copyto!(x, start); reset_solver_rng!(method)  (benchmark/cases.jl:356; Random.seed!(method.rng, 9) at :142-146). The timed call is PS.solve!(x, f, g, method) (:357-358)",
]
solver_options = [
  "CDSolver(order = :cyclic, tol = 1e-6, rng = Xoshiro(9)) (core_method, benchmark/cases.jl:330-336); no ProximalOptions are passed (own options)",
]
certificate = [
  "benchmark/cases.jl:360 check: certify(exact, Float64.(Array(output.minimizer))) on the Float64 problem (exact_problem, :319-320), independent of the solver and of ProximalBase iterates",
  "lasso_certificate, relative_gap (benchmark/certificates.jl:64-83, :358-360)",
]
measure = "relative_gap, target 1e-05 (benchmark/cases.jl:298 CORE_TARGETS, passed at :371-372)"
target = "1e-05"
work_counters = [
  "not in the formal record (benchmark/run.jl METRICS_HEADER stores time, GC share, bytes, certificate value and data_hash); passes and kkt checks come only from untimed diagnostics where available, as the Gate 0 ruling says, without a redesign of the engine",
]
sensitive_paths_06 = [
  "not audited per path in this campaign: Stack B is ProximalBase 50db4b1 (0.6.0-DEV, tree 4556e470), identified by the lock (commit, tree, package hash, manifests); the case is certified on both stacks by the matching validation instead",
]
class = "A"
approved = true
approval_url = "https://github.com/mlakolar/ProximalSolvers.jl/issues/330#issuecomment-6910364487"
class_reason = "identical harness bytes on both stacks; inputs/starts/targets/options/timing definitions identical"
verification_needed = [
  "matching validation (nonofficial, evidence not committed): certificate ok on both stacks and both Julia versions, identical data hashes and input fingerprints between the stacks; the successor smoke run before the official campaign",
]
equivalence_check = [
  "the fingerprint exporter (export_fingerprints.jl) writes the reset state, solver configuration, options and per-array input hashes of every case and repetition on both stacks outside any timed region; the comparator refuses a case whose fingerprints differ (migration_compare.py), and finalize checks the files before any measurement",
]

