# Case mapping of the CD-only successor campaign stage2b-cd-minimal-core-v1 (#333, under #110): the 21 current
# cd-group case IDs of the benchmark harness at ProximalSolvers 9f86a808 (master after #307), in the order of
# schedule.toml (the harness catalog order, which sorts by ID). This is NOT the original Stage 2B mapping
# (../stage2b/case-mapping.toml, the 19 frozen Stage 2A cases): none of these IDs has a Stage 2A record.
#
# Every row is class A. The harness is the SAME four files on both stacks: Stack A is b0de3f7 with a harness-only
# port (branch archive/stage2b-cd-stack-a-port) and Stack B is 9f86a808; the harness hash of both is
# 164fab53cac906e52e5a75e8b93658c1d174c14e. The inputs, starts, targets, options and timing definitions are therefore the
# same code, and the matching validation of the tooling PR certified all 21 cases on both stacks and both Julia versions
# with identical data hashes and input fingerprints. What is NOT identical is the solver: the stopping behaviour of
# CDSolver changed between the stacks (#293, #294, #295, #311), so a ratio is an accuracy-qualified end-to-end solve!
# time, not a kernel comparison (the successor issue and the readout protocol of #330 say how it is read).
#
# `role` is the comparator's positional label (migration_compare.py: the first 14 declared cases primary, the rest
# diagnostic). It carries no statistical meaning in this campaign: all 21 cases are read alike.
#
# Approval: the maintainer's Gate 0 ruling on #330, option (b). Citations are file:line of benchmark/ at 9f86a808.
# Read by Python's tomllib (migration_compare.py read_mapping, test_stage2b_cd_files.py).

schema = 1
campaign_definition = "stage2b-cd-minimal-core-v1"
harness_commit = "9f86a808bfac968f5421b9efeb6d0aecd7c1c775"
harness_hash = "164fab53cac906e52e5a75e8b93658c1d174c14e"
status = "definition of the CD-only successor campaign; no measurement is run or claimed by this file"

