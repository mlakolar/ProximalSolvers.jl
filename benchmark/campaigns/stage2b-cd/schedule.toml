# Stage 2B successor schedule (#333, under #110; Gate 0 ruling on #330): the CD-only, minimal-core campaign. This is
# NOT the original Stage 2B campaign pb06-migration-stage2b-v1, whose frozen definition stays in ../stage2b/.
#
# Same structure and same reading code as ../stage2b/schedule.toml (migration_compare.py load_schedule; the driver
# takes this directory with --campaign-dir). Same design: eight A/A and eight A/B paired fresh-process blocks per
# Julia-version stratum, repetition IDs 1-8, orders AB BA BA AB BA AB AB BA, the A/A arm on two independent
# installations of the identical Stack A. Stack A is b0de3f7 + registered ProximalBase 0.5.4 with a harness-only
# port (the four harness files of 9f86a808); Stack B is 9f86a808 + ProximalBase 50db4b1 (minimal-core, post-#307),
# given by the lock. The machine is Discovery EPYC 7513. test_stage2b_cd_files.py checks every identity below.

schema = 1

[schedule]
id = "stage2b-cd-8block-v1"
campaign_id = "stage2b-cd-minimal-core-v1"
reps = [1, 2, 3, 4, 5, 6, 7, 8]
arms = ["AB", "AA"]
orders = { 1 = "AB", 2 = "BA", 3 = "BA", 4 = "AB", 5 = "BA", 6 = "AB", 7 = "AB", 8 = "BA" }

# The Stage 2A sampling settings (benchmark/campaigns/pre06/campaign.toml): samples_target 100, seconds_limit 3,
# case_seconds 60, profile_seconds 0, one Julia thread and one BLAS thread, the same seed scheme. suite and groups
# are the strings run.jl records (PS_GROUPS sorted and comma-joined): the 21 cases below are the whole cd group of
# the extended suite that the harness of 9f86a808 supports (PS_LIST=true, PS_SUITE=extended, PS_GROUPS=cd).
# case_filter is those IDs in catalog order, joined by commas, byte for byte as PS_CASES. No case may be removed
# after the freeze.
[settings]
suite = "extended"
groups = "cd"
case_filter = "cd/lasso-B/cd/dense-f32/call,cd/lasso-B/cd/dense-f64/call,cd/lasso-B/cd/sparse-f32/call,cd/lasso-B/cd/sparse-f64/call,cd/lasso-B/cd/warm-dense-f32/call,cd/lasso-B/cd/warm-dense-f64/call,cd/lasso-B/cd/warm-sparse-f32/call,cd/lasso-B/cd/warm-sparse-f64/call,cd/lasso-C/cd/dense-f32/call,cd/lasso-C/cd/dense-f64/call,cd/lasso-C/cd/sparse-f32/call,cd/lasso-C/cd/sparse-f64/call,cd/lasso-D/cd/dense-f32/call,cd/lasso-D/cd/dense-f64/call,cd/lasso-D/cd/sparse-f32/call,cd/lasso-D/cd/sparse-f64/call,cd/lasso-dense/cd/R/call,cd/lasso/cd/dense-f32/call,cd/lasso/cd/dense-f64/call,cd/lasso/cd/sparse-f32/call,cd/lasso/cd/sparse-f64/call"
samples_target = 100
seconds_limit = 3.0
case_seconds = 60.0
profile_seconds = 0.0
julia_threads = 1
blas_threads = 1
seed_scheme = "FNV1a64 keyed scenario xor repetition"

# Discovery, AMD EPYC 7513 (read on node a03-14 under --partition=main --constraint=epyc-7513, job 14282683): 2
# sockets x 32 cores, one thread per core (smt/control "notsupported", so there is no sibling: smt_sibling is -1,
# the value the pilot writes for it), no cpufreq driver (the governor, epp and no_turbo files do not exist, which
# the driver's machine sampler records as "unavailable"). `cpu` is Sys.CPU_NAME of each Julia build: znver3 for both.
# The measured CPU is logical CPU 8; the driver stays off it. Policy values are labelled, never refused.
[machine]
cpu_model = "AMD EPYC 7513 32-Core Processor"
cpu = { "1.10" = "znver3", "1.13" = "znver3" }
logical_cpu = 8
smt_sibling = -1
governor = "unavailable"
epp = "unavailable"
no_turbo = "unavailable"
smt_control = "notsupported"

# The exact Julia builds (the same as Stage 2A).
[julia."1.10"]
version = "1.10.13"
commit = "e184dd512e35c5a6e036c9aab5e4de5a3345f62d"

[julia."1.13"]
version = "1.13.3"
commit = "67ac47b9cd855e02134d41d5428ac9f2a73f2694"

# Stack A: the harness-only port of #333 (parent b0de3f7, only benchmark/{problems,certificates,cases,run}.jl differ,
# taken from 9f86a808; branch archive/stage2b-cd-stack-a-port) and registered ProximalBase 0.5.4. The solver source is
# b0de3f7's: the package hash is that of Stage 2A. harness_hash is the harness hash of 9f86a808 (the same harness runs on both
# stacks).
[stack_a]
harness_hash = "164fab53cac906e52e5a75e8b93658c1d174c14e"

[stack_a.proximalsolvers]
commit = "03af89fd61c05cef1451dd6c0d9a05d68df5fecf"
tree = "10a902f87a74339184034e0e60d60269a65ef593"
version = "0.3.2"
package_hash = "f37fc61f300ad597a33c7ab5f448d38c865db854"

[stack_a.proximalbase]
tag = "v0.5.4"
commit = "9c5a43bf0b7e3f51f0a401b785c332200ffa5d7e"
tree = "1226119eb2cc6144f7345c727f0e7682632f7826"
version = "0.5.4"
release = "registered"
package_hash = "d4747f2ab51212b20d9adcf70e21c2200b090b2a"
