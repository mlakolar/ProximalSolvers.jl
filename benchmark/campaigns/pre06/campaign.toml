# Stage 2A campaign definition: historical pre-0.6 baseline (#110).
#
# Governing design: STAGE2_PLAN.md in this directory. This file, cases.txt and the pinned
# identities below are the F1 freeze; the freeze commit is the commit that merges them,
# recorded on #110. Any change to this file, to cases.txt or to a pinned identity is a new
# campaign identity (STAGE2_PLAN.md §1.2, §3); the old one and its evidence are kept.
#
# campaign.py reads every value below and refuses to run or verify when the checkout, the
# environment, the records or the machine disagree with it. Read by Python's tomllib.

schema = 1
campaign_id = "pre06-stage2a-v1"
design = "benchmark/campaigns/pre06/STAGE2_PLAN.md"
issue = "https://github.com/mlakolar/ProximalSolvers.jl/issues/110"
design_pr = "https://github.com/mlakolar/ProximalSolvers.jl/pull/212"
approval = "https://github.com/mlakolar/ProximalSolvers.jl/pull/212#issuecomment-6650942186"
carry_overs = "https://github.com/mlakolar/ProximalSolvers.jl/issues/110#issuecomment-6651681172"
# What the campaign is: a historical correctness-and-timing snapshot of one declared stack.
# Every primary case is sub-millisecond. The archive supports no per-case statistical
# noninferiority, no-regression or 5% claim (STAGE2_PLAN.md §5, gates B and C).
claim = "historical correctness-and-timing snapshot; not a per-case noninferiority or no-regression certificate"

[cases]
file = "cases.txt"
sha256 = "20b79478b085ca6bab43d3c5fe536477f639af62f5524c02e7304079188e1037"
count = 19
primary = 14
diagnostic = 5

# The measured package: a clean checkout of this commit. Its tree must equal `tree`.
[proximalsolvers]
repository = "https://github.com/mlakolar/ProximalSolvers.jl.git"
commit = "b0de3f7fc91767b97197ff4b458207e308998943"
tree = "a836d532008782e75f2b2a7e4666fa1df24b34dc"
version = "0.3.2"
# run.jl fingerprints (SHA-1), as recorded in the metadata of every repetition.
package_hash = "f37fc61f300ad597a33c7ab5f448d38c865db854"   # proximalsolvers_hash
harness_hash = "b7bf3d953ec6e9f9720e74d7895b5cf95a629fd4"   # problems/certificates/cases/run.jl
# Paths whose content the freeze commit must leave identical to `commit`: the package
# source, the four-file harness, and the tools the campaign runs or re-runs from a checkout.
unchanged_paths = [
  "Project.toml", "src", "ext",
  "benchmark/Project.toml", "benchmark/problems.jl", "benchmark/certificates.jl",
  "benchmark/cases.jl", "benchmark/run.jl", "benchmark/setup.jl", "benchmark/local.jl",
  "benchmark/validate.py", "benchmark/summarize.py", "benchmark/check_analysis.py",
]

# The dependency: the registered release, never a commit that merely says 0.5.4.
[proximalbase]
name = "ProximalBase"
uuid = "0a755509-c5b1-5d6f-9b24-59bcda3c37a3"
version = "0.5.4"
repository = "https://github.com/mlakolar/ProximalBase.jl.git"
release_tag = "v0.5.4"
tag_object = "ebe93e42fcbda44e83b5174ac64a67330b99e87f"
tag_commit = "9c5a43bf0b7e3f51f0a401b785c332200ffa5d7e"
# The tag's tree. The General registry entry for 0.5.4, the Manifest git-tree-sha1 and the
# git tree hash of the loaded package directory must all equal it.
tree = "1226119eb2cc6144f7345c727f0e7682632f7826"
package_hash = "d4747f2ab51212b20d9adcf70e21c2200b090b2a"   # run.jl proximalbase_hash
registry = "General"
registry_uuid = "23338594-aafe-5451-b93e-139f81909106"

# Environment variables of every formal process, exactly. campaign.py starts each process
# from these, the per-process values below and a short list of passed-through variables
# (PATH, HOME, USER, LOGNAME, LANG, LC_ALL, TMPDIR, JULIA_PKG_SERVER), and nothing else.
# Per process: PS_CASES (cases.txt joined by commas, the `case_filter` byte for byte),
# PS_REPETITION, PS_OUTPUT, PS_EXPECTED_PACKAGE_ROOT (the pinned checkout) and
# JULIA_DEPOT_PATH (a campaign depot, then Julia's bundled depots); after setup also
# JULIA_PKG_OFFLINE=true (no registry or package updates) and, for the selection check only,
# PS_LIST=true.
# JULIA_LOAD_PATH keeps the user's default environment (for example Revise) out of the
# formal processes; it does not change what is loaded from the campaign environment.
[settings]
PS_SUITE = "extended"
PS_GROUPS = "cd,sgl,gradient,newton,admm,paths,primal_dual"
PS_SAMPLES = "100"
PS_SECONDS = "3"
PS_CASE_SECONDS = "60"
PS_PROFILE_SECONDS = "0"
JULIA_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
JULIA_LOAD_PATH = "@:@stdlib"

[protocol]
julia_flags = ["--startup-file=no", "--history-file=no"]
repetitions = 5                  # PS_REPETITION = 1..5, each a fresh Julia process
proximalbase_spec = "0.5.4"      # third argument of benchmark/setup.jl
# 0: every case ok. 2: complete records with at least one non-ok case; the run continues
# and the numerical gate fails. Any other exit code, failed check or interruption stops it.
accepted_exit_codes = [0, 2]
# Retry policy (predeclared, STAGE2_PLAN.md §5). Never rerun one repetition or one case,
# never drop or replace a repetition, and never retry because of a numerical result (exit
# code 2). A Julia version whose attempt stops for an infrastructure reason (startup, load,
# recording, check or machine failure) may be repeated once, completely (setup and all five
# repetitions), in a fresh root and environment, after the cause is recorded on #110. The
# stopped attempt is archived under attempts/. A second stop needs a versioned amendment.
max_complete_attempts = 2
# Untimed exploratory receipts, after the formal repetitions, in the same environment and
# on the same CPU: work counters (benchmark/local.jl --save, all 19 IDs in one process,
# STAGE2_PLAN.md §5) and per-case first-call time including compilation (one local.jl
# process per case, §1.2). Labelled exploratory; never accepted by validate.py/compare.py.
local_rep = 1
local_first_call_samples = 5

# The machine chosen at F1 (STAGE2_PLAN.md §5, decision D3), inspected on 2026-11-04:
# Linux (Pop!_OS 24.04, kernel 7.2.15), Intel Core i9-13900 hybrid CPU, performance cores
# = logical CPUs 0-15 (/sys/devices/cpu_core/cpus, SMT pairs), efficiency cores 16-31.
# Logical CPU 6 (core 3, max 5.3 GHz) was chosen: a performance core outside the favored
# ITMT cores 8-11 (which attracted most stray work, about 2.6% busy over 20 s), with the
# lowest observed activity (0.10% busy) and an idle SMT sibling 7 (0.00%). No root access:
# the sibling cannot be taken offline and the governor (intel_pstate powersave, EPP
# balance_performance) and turbo (enabled) cannot be changed, so they are recorded and
# compared, not set.
[machine]
platform = "linux"
cpu_model = "13th Gen Intel(R) Core(TM) i9-13900"   # Sys.cpu_info()[1].model, metadata `cpu_model`
performance_cpus = "0-15"                           # /sys/devices/cpu_core/cpus
logical_cpu = 6                                     # taskset -c for every formal process, both stacks
smt_sibling = 7                                     # must stay idle
governor = "powersave"
energy_performance_preference = "balance_performance"
no_turbo = "0"
# A repetition counts as controlled only if, during it, the formal process was allowed
# and observed only on logical_cpu, the sibling was busy at most this fraction of the
# time, the 1-minute load average at its start was at most max_load1, and the frequency
# policy above was unchanged. Otherwise the campaign is labelled observational; a wrong
# affinity stops it.
max_sibling_busy = 0.05
max_load1 = 1.0
# Before each repetition, wait up to this long for the load to fall to max_load1: the
# campaign's own setup and precompilation raise it (pilot: 1.5-1.6 at the first start).
settle_seconds = 300

# D5: the durable home is a GitHub Release asset of this repository, uploaded by the
# maintainer under a tag that is not a package release.
[archive]
name = "pre06-stage2a-campaign-v1"   # the official root directory and archive stem
repository = "mlakolar/ProximalSolvers.jl"
release_tag = "bench-pre06-v1"
asset = "pre06-stage2a-campaign-v1.tar.gz"
uploaded_by = "maintainer"
retention = "permanent release asset; never replaced (a correction is a new tag and asset)"

